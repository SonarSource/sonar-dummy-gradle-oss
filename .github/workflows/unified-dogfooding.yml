name: Unified Dogfooding scans
on:
  schedule:
    # Run the workflow every day at 04:00 UTC
    - cron: '0 4 * * *'
  workflow_dispatch:
  pull_request: # SC-60373 WIF pilot only, remove before merge

env:
  CACHE_BACKEND: s3

jobs:
  build:
    runs-on: sonar-s
    name: Build and run shadow scans
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: SonarSource/mise-action-wrapper@65aa289d3f408f4999d13a52a14cde4f54b48442 # 2.0.0
        with:
          version: 2025.7.12
      - uses: SonarSource/ci-github-actions/build-gradle@f92738b60fafe698bd3675185413313aed66a74e # SC-60373 / #367 pilot only; revert before merge
        with:
          run-shadow-scans: true
          artifactory-reader-role: private-reader
          artifactory-deployer-role: qa-deployer
      - name: Run IRIS Analysis
        uses: SonarSource/unified-dogfooding-actions/run-iris@master # dogfood
        with:
          primary_project_key: "SonarSource_sonar-dummy-gradle-oss"
          primary_platform: "SQC-EU"
          shadow1_project_key: "SonarSource_sonar-dummy-gradle-oss"
          shadow1_platform: "Next"
          shadow2_project_key: "SonarSource_sonar-dummy-gradle-oss"
          shadow2_platform: "SQC-US"
