---
on:
  pull_request:
  merge_group:
  push:
    branches:
      - master

name: pre-commit

jobs:
  pre-commit:
    runs-on: sonar-xs
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: SonarSource/gh-action_pre-commit@master
