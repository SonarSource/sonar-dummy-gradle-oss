name: Releasability Status
on:
  workflow_run:
    workflows: ["Build"]
    types:
      - completed
    branches:
      - master
      - dogfood-*
      - branch-*

jobs:
  releasability-status:
    name: Releasability status
    runs-on: sonar-s
    permissions:
      id-token: write
      statuses: write
      contents: read
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: SonarSource/gh-action_releasability/releasability-status@master # dogfood
        env:
          GITHUB_TOKEN: ${{ github.token }}
